name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: 'And what you expected instead.' }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where, description: 'Hosted site URL, npx gource-online, or a local build (commit)' }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: 'A repository URL or a small log file helps most.' }
  - type: input
    id: browser
    attributes: { label: Browser and OS }
