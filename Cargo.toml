[workspace]
resolver = "3"
members = [
    "crates/gource-core",
    "crates/gource-sources",
    "crates/gource-render",
    "crates/gource-render-webgl2",
    "crates/gource-web",
    "crates/gource-cli",
    "crates/gource-mux",
]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/joe-byounghern-kim/gource-online"

[workspace.dependencies]
gource-core = { path = "crates/gource-core" }
gource-sources = { path = "crates/gource-sources" }
gource-render = { path = "crates/gource-render" }
gource-render-webgl2 = { path = "crates/gource-render-webgl2" }
gource-mux = { path = "crates/gource-mux" }

wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"

# Math: scalar-math + libm keep native and wasm32 results bit-identical.
glam = { version = "0.34", default-features = false, features = ["std", "scalar-math", "libm"] }
libm = "0.2"
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
