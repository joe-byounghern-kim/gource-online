[package]
name = "gource-render-webgl2-demo"
description = "Standalone verification page for the WebGL2 backend: draws a synthetic frame"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

# Separate workspace so the root workspace stays untouched.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
gource-render = { path = "../../gource-render" }
gource-render-webgl2 = { path = ".." }
# Must match the wasm-bindgen CLI used to generate the bindings.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomStringMap",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
